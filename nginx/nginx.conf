# Nginx Configuration for SSO Demo
# 该文件是完整的主配置文件，可直接复制到 Nginx 的 conf 目录
# Windows: C:\nginx\conf\nginx.conf   （覆盖原有文件）
# Linux:   /etc/nginx/nginx.conf      （覆盖原有文件）
#
# 覆盖后直接运行：nginx（Windows 下双击 nginx.exe 或在命令行运行 nginx）
# 修改配置后重载：nginx -s reload

# 进程数，建议设为 CPU 核心数
worker_processes  1;

# 错误日志（相对于 Nginx 安装目录）
error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

# 主进程 PID 文件
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ============ SSO 站点配置 ============

    server {
        listen 80;
        server_name appa.tbk.com;

        # 日志配置
        access_log logs/appa.access.log;
        error_log logs/appa.error.log;

        location / {
            proxy_pass http://localhost:10000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 80;
        server_name appb.tbk.com;

        # 日志配置
        access_log logs/appb.access.log;
        error_log logs/appb.error.log;

        location / {
            proxy_pass http://localhost:20000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

