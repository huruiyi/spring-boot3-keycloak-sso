# Nginx Configuration for SSO Demo
# 将此配置文件复制到 Nginx 的 sites-available 目录（Linux）
# 或者添加到 nginx.conf 的 http 块中（Windows/Mac）

# Windows: C:\nginx\conf\nginx.conf
# Linux: /etc/nginx/sites-available/sso-demo -> /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name appa.tbk.com;

    # 日志配置
    access_log logs/appa.access.log;
    error_log logs/appa.error.log;

    location / {
        proxy_pass http://localhost:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name appb.tbk.com;

    # 日志配置
    access_log logs/appb.access.log;
    error_log logs/appb.error.log;

    location / {
        proxy_pass http://localhost:20000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

