server:
  port: 20000
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

spring:
  application:
    name: app-b
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: app-b
            client-secret: OeUio0MRCzC3S2wFckk46RmD0Tlg8oQy
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            post-logout-redirect-uri: "{baseUrl}/"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/fairy.vip
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fairy.vip
          jwk-set-uri: http://localhost:8080/realms/fairy.vip/protocol/openid-connect/certs
  session:
    timeout: 30m

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
